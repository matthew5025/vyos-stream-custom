name: Refresh Upstream Source

"on":
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Refresh upstream tree and reapply patches
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y jq
          ./scripts/refresh-upstream.sh

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh-upstream-from-config
          title: Refresh upstream VyOS source from custom-build.json
          commit-message: Refresh upstream VyOS source from custom-build.json
          body: |
            Refreshes `upstream/vyos-build/` from `custom-build.json` and reapplies the patch series in `patches/`.
