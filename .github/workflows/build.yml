name: Build Custom VyOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: ISO version string
        required: false
        default: 2026.03-mt7922

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          set -eux
          docker pull vyos/vyos-build:circinus
          docker run --rm --privileged \
            -v "$PWD:/repo" \
            -w /repo \
            -e VERSION="${{ inputs.version }}" \
            vyos/vyos-build:circinus \
            bash -lc ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyos-stream-custom-amd64
          path: out/
