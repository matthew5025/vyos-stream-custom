name: Build Custom VyOS

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: ISO version string
        required: false
        default: 2026.03-custom

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Load build config
        run: |
          set -eux
          image="$(jq -r '.build_container' custom-build.json)"
          version="${{ inputs.version || '' }}"
          if [ -z "$version" ]; then
            version="$(jq -r '.version' custom-build.json)"
          fi
          echo "BUILD_IMAGE=$image" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pull build container
        run: docker pull "$BUILD_IMAGE"

      - name: Show build config
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e "VERSION=$BUILD_VERSION" \
            "$BUILD_IMAGE" \
            bash -lc './scripts/build.sh show-config'

      - name: Build kernel and firmware packages
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" \
            -w /repo \
            -e "VERSION=$BUILD_VERSION" \
            "$BUILD_IMAGE" \
            bash -lc './scripts/build.sh kernel-packages'

      - name: Stage custom packages
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e "VERSION=$BUILD_VERSION" \
            "$BUILD_IMAGE" \
            bash -lc './scripts/build.sh stage-packages'

      - name: Build ISO
        run: |
          docker run --rm --privileged \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "$PWD:/repo" \
            -w /repo \
            -e "VERSION=$BUILD_VERSION" \
            "$BUILD_IMAGE" \
            -lc 'test "$(id -u)" = 0 && ./scripts/build.sh iso'

      - name: Collect ISO outputs
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e "VERSION=$BUILD_VERSION" \
            "$BUILD_IMAGE" \
            bash -lc './scripts/build.sh collect'

      - name: Verify ISO outputs
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e "VERSION=$BUILD_VERSION" \
            "$BUILD_IMAGE" \
            bash -lc './scripts/build.sh verify'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vyos-custom-amd64
          path: out/

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: ${{ env.BUILD_VERSION }}
          files: out/*
          make_latest: false
