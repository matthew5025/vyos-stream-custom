name: Build Custom VyOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: ISO version string
        required: false
        default: 2026.03-custom

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          set -eux
          image="$(jq -r '.build_container' custom-build.json)"
          version="${{ inputs.version }}"
          docker pull "$image"
          args=(docker run --rm --privileged -v "$PWD:/repo" -w /repo -e "VERSION=$version")
          args+=("$image" bash -lc ./scripts/build.sh)
          "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyos-custom-amd64
          path: out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || 'custom-build' }}
          name: ${{ inputs.version || 'custom-build' }}
          files: out/*
          make_latest: false
